<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" preserveAspectRatio="xMidYMid slice" aria-label="Праздничный фон">
  <defs>
    <linearGradient id="bg-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D3E2"/>
      <stop offset="0.42" stop-color="#F3C0D2"/>
      <stop offset="1" stop-color="#F6D0DE"/>
    </linearGradient>
    <radialGradient id="bg-frost" cx="50%" cy="-5%" r="72%">
      <stop offset="0" stop-color="#E7D0E4" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#F4D0DE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F4D0DE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-warm" cx="78%" cy="24%" r="48%">
      <stop offset="0" stop-color="#F6C4C6" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#F4C6D4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F4C6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-blush" cx="16%" cy="6%" r="36%">
      <stop offset="0" stop-color="#F2B4C8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2B4C8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="800" fill="url(#bg-base)"/>
  <rect width="400" height="800" fill="url(#bg-frost)"/>
  <rect width="400" height="800" fill="url(#bg-blush)"/>
  <rect width="400" height="800" fill="url(#bg-warm)"/>
