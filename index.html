<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf7f8">
<title>Карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4/dist/bwip-js-min.js" defer></script>

<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="scroller" class="scroller">
<header class="top">
  <div class="titlebar">
    <h1>Карточки</h1>
    <div class="tools">
      <button id="addBtn" class="pill one" aria-label="Добавить карту"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="pill two">
        <button id="searchBtn" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
        <button id="moreBtn" aria-label="Ещё"><svg viewBox="0 0 24 24" class="dots"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg></button>
      </div>
    </div>
  </div>
  <div id="searchBar" class="searchbar">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Поиск" autocomplete="off"></label>
    <button id="searchCancel" class="text">Отменить</button>
  </div>
</header>

<main id="stack" class="stack"></main>
<div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="empty" class="empty hidden">
  <div class="ghostcard"></div>
  <p><b>Пока нет карт</b><br>Нажмите «+», чтобы добавить первую</p>
</div>

<section id="viewer" class="viewer hidden">
  <div class="panel">
    <div class="codebox"><canvas id="vCode"></canvas></div>
    <div id="numRow" class="numrow"><span id="vNum"></span>
      <button id="copyBtn" class="icon" aria-label="Копировать"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>
  </div>
  <p class="hint">Смахните вниз или коснитесь стопки, чтобы закрыть</p><div class="actions">
    <button id="editBtn" class="text">Изменить</button>
    <button id="delBtn" class="text danger">Удалить</button>
  </div>
</section>

</div>
<div id="addMenu" class="sheet-wrap hidden">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>Добавить карту</h2>
    <div class="group">
      <button class="opt" data-act="camera"><i><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg></i><span><b>Камера</b><small>Наведите на штрихкод</small></span><em>›</em></button>
      <button class="opt" data-act="gallery"><i><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg></i><span><b>Из галереи</b><small>Скриншот или фото карты</small></span><em>›</em></button>
      <button class="opt" data-act="manual"><i><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7.5 14h9"/></svg></i><span><b>Ввести номер</b><small>Вручную</small></span><em>›</em></button>
    </div>
    <button class="text wide cancel" data-act="cancel">Отмена</button>
    <input id="fileIn" type="file" accept="image/*" hidden>
  </div>
</div>

<div id="cam" class="cam hidden">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <p class="camhint">Наведите камеру на штрихкод</p>
  <button id="camClose" class="primary glass">Отмена</button>
</div>

<div id="editor" class="sheet-wrap hidden">
  <div class="backdrop"></div>
  <form id="form" class="sheet">
    <div class="grabber"></div>
    <div class="formhead"><button type="button" id="edCancel" class="text">Отмена</button><h3 id="edTitle">Новая карта</h3><button type="submit" class="text strong">Готово</button></div>
    <div id="edPreview" class="card mini"></div>
    <div class="group fields">
      <label><span>Магазин</span><input id="fName" list="shops" required placeholder="Например, АШАН" autocomplete="off"></label>
      <label><span>Код</span><input id="fNum" required autocomplete="off" placeholder="Содержимое кода"></label>
      <label><span>Номер</span><input id="fDisp" inputmode="numeric" autocomplete="off" placeholder="Как на карте (необяз.)"></label>
      <label><span>Формат</span><select id="fFmt"></select></label>
    </div>
    <datalist id="shops"></datalist>
    <p class="caption">Цвет</p>
    <div class="colors" id="colors"></div>
    <p id="edMsg" class="msg"></p>
  </form>
</div>
<div id="toast" class="toast"></div>
<script src="seed.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
